run:
  seed: 42
  run_id: synthetic-efficient
data:
  tickers:
  - SIMA
  - SIMB
  - SIMC
  - SIMD
  - SIME
  - SIMF
  start: '2010-01-01'
  end: '2026-09-01'
  cache_dir: data/synthetic
  offline: true
  max_missing_frac: 0.02
  max_ffill_days: 1
features:
  horizon: 1
  n_lags: 10
  roll_windows:
  - 5
  - 21
  - 63
  drawdown_window: 21
  rvol_window: 21
  include_day_of_week: true
splits:
  mode: expanding
  initial_train_years: 5
  test_months: 6
  rolling_years: 5
  gap_days: 1
models:
  zero_return: {}
  historical_mean: {}
  arima:
    order:
    - 1
    - 0
    - 1
    auto: false
    max_p: 2
    max_q: 2
    trend: c
  arima_garch:
    mean_lags: 1
    dist: t
    p: 1
    q: 1
  ridge:
    alpha: 10.0
    fit_intercept: true
  lstm:
    sequence_length: 20
    n_layers: 1
    units: 32
    dropout: 0.2
    learning_rate: 0.001
    epochs: 40
    batch_size: 128
    patience: 5
    val_frac: 0.15
    pooled: true
    embedding_dim: 4
backtest:
  cost_bps: 5.0
  threshold: 0.0
  vol_target: null
  vol_scale_cap: 2.0
  ann_factor: 252
report:
  output_dir: results
  latest_dir: results/latest
  make_plots: true
  note: SIMULATED DATA - NOT A MARKET RESULT. Prices come from scripts/make_synthetic_universe.py,
    not from Yahoo Finance, because the environment this package was built in had
    no market-data egress. The data-generating process has GARCH(1,1) conditional
    variance, Student-t(5) innovations and a common factor, but no exploitable predictability
    in the conditional mean, so the expected result is that nothing beats the random-walk
    baseline. See results/control/summary.md for the positive control that shows this
    harness does detect signal when signal is present.
