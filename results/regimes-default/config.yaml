run:
  seed: 42
  run_id: regimes-default
data:
  tickers:
  - AAPL
  - JPM
  - KO
  - XOM
  - MSFT
  - PG
  start: '2010-01-01'
  end: null
  cache_dir: data/raw
  offline: false
  max_missing_frac: 0.02
  max_ffill_days: 1
features:
  horizon: 1
  n_lags: 10
  roll_windows:
  - 5
  - 21
  - 63
  drawdown_window: 21
  rvol_window: 21
  include_day_of_week: true
  market_features: false
splits:
  mode: expanding
  initial_train_years: 5
  test_months: 6
  rolling_years: 5
  gap_days: 1
models:
  zero_return: {}
  historical_mean: {}
  arima:
    order:
    - 1
    - 0
    - 1
    auto: false
    max_p: 2
    max_q: 2
    trend: c
  arima_garch:
    mean_lags: 1
    dist: t
    p: 1
    q: 1
  ridge:
    alpha: 10.0
    fit_intercept: true
  lstm:
    sequence_length: 20
    n_layers: 1
    units: 32
    dropout: 0.2
    learning_rate: 0.001
    epochs: 40
    batch_size: 128
    patience: 5
    val_frac: 0.15
    pooled: true
    embedding_dim: 4
    tune_grid: []
backtest:
  cost_bps: 5.0
  threshold: 0.0
  vol_target: null
  vol_scale_cap: 2.0
  ann_factor: 252
report:
  output_dir: /tmp/efruns
  latest_dir: results/regimes-default
  make_plots: true
  note: null
