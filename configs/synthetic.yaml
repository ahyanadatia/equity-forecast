# Reference run on a SIMULATED near-efficient market.
#
# Same shape as configs/default.yaml - six tickers, 2010-2026, expanding
# walk-forward - but the prices come from scripts/make_synthetic_universe.py
# rather than from Yahoo Finance, because the environment this package was built
# in had no market-data egress.
#
# The data-generating process has GARCH(1,1) conditional variance, Student-t(5)
# innovations and a common factor, but NO exploitable predictability in the
# conditional mean. The expected result is therefore that nothing beats the
# random-walk baseline. If something does, the harness is broken - which is what
# configs/synthetic_signal.yaml exists to rule out.
#
#   python scripts/make_synthetic_universe.py
#   equity-forecast run --config configs/synthetic.yaml
run:
  seed: 42
  run_id: "synthetic-efficient"

data:
  tickers: [SIMA, SIMB, SIMC, SIMD, SIME, SIMF]
  start: "2010-01-01"
  end: "2026-09-01"
  cache_dir: "data/synthetic"
  offline: true           # simulated prices; never touch the network
  max_missing_frac: 0.02  # drop a ticker missing more than this fraction of the calendar
  max_ffill_days: 1

features:
  horizon: 1              # forecast horizon in trading days
  n_lags: 10
  roll_windows: [5, 21, 63]
  drawdown_window: 21
  rvol_window: 21
  include_day_of_week: true

splits:
  mode: expanding         # expanding | rolling
  initial_train_years: 5
  test_months: 6
  rolling_years: 5
  gap_days: 1             # embargo (trading days) between train end and test start

models:
  zero_return: {}
  historical_mean: {}
  arima:
    order: [1, 0, 1]
    auto: false           # true -> small AIC grid over p,q in {0,1,2}
    max_p: 2
    max_q: 2
    trend: "c"
  arima_garch:
    mean_lags: 1
    dist: "t"             # Student-t innovations
    p: 1                  # GARCH ARCH order
    q: 1                  # GARCH lag order
  ridge:
    alpha: 10.0
    fit_intercept: true
  lstm:
    sequence_length: 20
    n_layers: 1
    units: 32
    dropout: 0.2
    learning_rate: 0.001
    epochs: 40
    batch_size: 128
    patience: 5
    val_frac: 0.15
    pooled: true          # true -> one model across tickers with a ticker embedding
    embedding_dim: 4

backtest:
  cost_bps: 5.0
  threshold: 0.0          # |forecast| below this -> flat
  vol_target: null        # e.g. 0.10 for 10% annualised vol targeting (needs a vol forecast)
  vol_scale_cap: 2.0
  ann_factor: 252

report:
  output_dir: "results"
  latest_dir: "results/null"
  make_plots: true
  note: >-
    SIMULATED DATA - NOT A MARKET RESULT. Prices come from scripts/make_synthetic_universe.py,
    not from Yahoo Finance. This is the null control. The data-generating process has GARCH(1,1) conditional variance, Student-t(5)
    innovations and a common factor, but no exploitable predictability in the conditional mean,
    so the expected result is that nothing beats the random-walk baseline. See
    results/control/summary.md for the positive control that shows this harness does detect
    signal when signal is present.
